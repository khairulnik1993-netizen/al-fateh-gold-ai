name: Build AL FATEH GOLD AI APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Locate and prepare Flutter project
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 2 -type f -iname 'AL_FATEH_GOLD_AI_PRO_V8_Android_Source_v1.1.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "Project ZIP not found in repository."
            ls -la
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_DIR="$(dirname "$(find extracted -type f -name pubspec.yaml -print -quit)")"
          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/lib/main.dart" ]; then
            echo "Could not find pubspec.yaml and lib/main.dart in the ZIP."
            find extracted -maxdepth 5 -type f | head -100
            exit 1
          fi

          mkdir -p work
          cp -a "$PROJECT_DIR/." work/

          cd work
          flutter create --platforms=android --org com.alfateh.gold .
          # Restore the supplied app source and package manifest after scaffold generation.
          cp -a "$PROJECT_DIR/lib/." lib/
          cp "$PROJECT_DIR/pubspec.yaml" pubspec.yaml

          if [ -f "$PROJECT_DIR/android/app/src/main/AndroidManifest.xml" ]; then
            cp "$PROJECT_DIR/android/app/src/main/AndroidManifest.xml" android/app/src/main/AndroidManifest.xml
          fi

          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: al-fateh-gold-ai-apk
          path: work/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
