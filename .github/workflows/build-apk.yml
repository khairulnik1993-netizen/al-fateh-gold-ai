
name: Build AL FATEH GOLD AI PRO V11 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable

      - name: Extract V11 source
        run: |
          mkdir -p restored
          unzip -o AL_FATEH_GOLD_AI_PRO_V11_COMPLETE_SOURCE.zip -d restored

          echo "Checking extracted files..."
          ls -la restored

          test -d restored/lib
          test -f restored/pubspec.yaml

      - name: Create Android wrapper
        run: flutter create --platforms=android --org com.alfateh.gold work

      - name: Copy V11 app source
        run: |
          cp -a restored/lib work/
          cp restored/pubspec.yaml work/

          if [ -f restored/android/app/src/main/AndroidManifest.xml ]; then
            cp restored/android/app/src/main/AndroidManifest.xml work/android/app/src/main/AndroidManifest.xml
          fi

      - name: Build release APK
        run: |
          cd work
          flutter pub get
          flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AL-FATEH-GOLD-AI-PRO-V11-APK
          path: work/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
