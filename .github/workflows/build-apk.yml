
name: Build AL FATEH GOLD AI PRO V11 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable

      - name: Check V11 source
        run: |
          echo "Checking V11 files..."
          ls -la

          if [ ! -d "lib" ] || [ ! -f "pubspec.yaml" ]; then
            echo "ERROR: Folder lib atau pubspec.yaml tiada di root."
            find . -maxdepth 4 -type f
            exit 1
          fi

      - name: Create Android wrapper
        run: flutter create --platforms=android --org com.alfateh.gold work

      - name: Copy V11 source
        run: |
          cp -a lib work/
          cp pubspec.yaml work/

          if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
            cp android/app/src/main/AndroidManifest.xml work/android/app/src/main/AndroidManifest.xml
          fi

      - name: Build release APK
        run: |
          cd work
          flutter pub get
          flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AL-FATEH-GOLD-AI-PRO-V11-APK
          path: work/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
