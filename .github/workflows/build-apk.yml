
      - name: Restore V11 source
        run: |
          mkdir -p restored

          if [ -d "lib" ] && [ -f "pubspec.yaml" ]; then
            cp -a lib pubspec.yaml restored/
          elif [ -d "al_fateh_android/lib" ] && [ -f "al_fateh_android/pubspec.yaml" ]; then
            cp -a al_fateh_android/lib al_fateh_android/pubspec.yaml restored/
          else
            echo "ERROR: V11 source not found!"
            ls -la
            exit 1
          fi

          ls -la restored
