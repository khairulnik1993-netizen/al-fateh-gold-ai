name: Build AL FATEH GOLD AI APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'AL_FATEH_GOLD_AI_PRO_V8_Android_Source_v1.1.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Flutter Android project
        run: |
          mkdir -p work
          unzip -q AL_FATEH_GOLD_AI_PRO_V8_Android_Source_v1.1.zip -d work
          cd work
          flutter create --platforms=android --org com.alfateh.gold .
          # Restore the supplied app source and dependency manifest over the generated scaffold.
          unzip -oq ../AL_FATEH_GOLD_AI_PRO_V8_Android_Source_v1.1.zip -d restored
          cp -a restored/lib ./lib
          cp restored/pubspec.yaml ./pubspec.yaml
          if [ -f restored/android/app/src/main/AndroidManifest.xml ]; then
            cp restored/android/app/src/main/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          fi
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: al-fateh-gold-ai-apk
          path: work/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
