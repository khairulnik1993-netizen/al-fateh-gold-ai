
name: Build AL FATEH GOLD AI PRO V10 APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'

      - name: Create Android wrapper
        run: flutter create --platforms=android --org com.alfateh.gold work

      - name: Copy app source
        run: |
          cp -a lib work/
          cp pubspec.yaml work/
          cp android/app/src/main/AndroidManifest.xml work/android/app/src/main/AndroidManifest.xml

      - name: Build release APK
        run: |
          cd work
          flutter pub get
          flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AL-FATEH-GOLD-AI-PRO-V10-APK
          path: work/build/app/outputs/flutter-apk/app-release.apk
